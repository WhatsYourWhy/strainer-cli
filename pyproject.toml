[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "strainer-cli"
version = "0.2.0"
description = "Offline document summarization and tagging for text and Markdown"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["summarization", "tagging", "offline", "nlp", "extractive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
strainer = "strainer.cli:main_entry"

[project.optional-dependencies]
smart = ["sentence-transformers", "numpy", "torch"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["strainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
